name: Auto API Test

on:
  push:
    branches: [ "auto_test" ]
  pull_request:
    branches: [ "auto_test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 启动 MySQL 容器
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: video_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    permissions:
      contents: write

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v3

    # ---------- 启动 Java 后端所需步骤 ----------
    - name: 2. 安装 JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21' # 改成你 Java 项目实际使用的版本 (如 8, 11, 17, 21)

    - name: 3. 初始化数据库表结构
      run: |
        sudo apt-get install -y mysql-client
        # 导入你导出的表结构（这里假设 init.sql 在根目录）
        mysql -h 127.0.0.1 -uroot -p123456 video_platform < init.sql

    - name: 4. 打包并启动 Java 后端
      # working-directory 要填你 Java 后端代码所在的目录
      working-directory: ./video-server 
      run: |
        # 使用 Maven 打包 (如果用的是 Gradle，换成 ./gradlew build)
        mvn clean package -DskipTests
        
        # 后台启动 Spring Boot 应用，并把日志输出到 backend.log
        # 假设打包出来的 jar 包在 target 目录下
        nohup java -jar target/*.jar > backend.log 2>&1 &
        
        # 循环等待后端启动完成 (检查 8080 端口是否可用)
        echo "等待后端启动..."
        for i in {1..30}; do
          if curl -s http://127.0.0.1:8080/api/user/hot > /dev/null; then
            echo "✅ 后端启动成功！"
            break
          fi
          echo "后端还未就绪，等待 2 秒..."
          sleep 2
        done
    # ----------------------------------------

    - name: 5. 安装 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 6. 安装 Python 项目依赖
      working-directory: ./auto_test # 进入你的 python 目录
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 7. 安装 Allure 命令行工具
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre
        wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        tar -zxvf allure-2.24.0.tgz
        sudo mv allure-2.24.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    # ---------- 执行测试（不需要跳过啦！） ----------
    - name: 8. 执行测试用例
      working-directory: ./auto_test
      run: |
        # 注意：不要加 || true，让测试结果决定流水线的成败
        # 不需要 --env=github，直接用默认配置连 127.0.0.1:8080 和 127.0.0.1:3306
        pytest --alluredir=./allure-results

    - name: 9. 生成 Allure HTML 报告
      working-directory: ./auto_test
      run: |
        allure generate ./allure-results -o ./allure-report --clean

    - name: 10. 将报告发布到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./auto_test/allure-report