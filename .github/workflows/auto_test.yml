name: Auto API Test

on:
  push:
    branches: [ "auto_test" ]
  pull_request:
    branches: [ "auto_test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: video_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    permissions:
      contents: write

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v3

    - name: 2. 安装 JDK (只需 JRE 运行环境即可)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17' # 改成你编译 jar 时用的 Java 版本

    - name: 3. 初始化数据库表结构
      run: |
        sudo apt-get install -y mysql-client
        mysql -h 127.0.0.1 -uroot -p123456 video_platform < init.sql

    - name: 4. 启动 Java 后端 (直接运行根目录的 jar 包)
      run: |
        # 注意：这里的 jar 包名要和根目录里的完全一致
        nohup java -jar video-server-1.0.0.jar > backend.log 2>&1 &
        
        echo "等待后端启动..."
        for i in {1..30}; do
          # 替换成你项目里一个不传参的 GET 接口，用于探活
          if curl -s http://127.0.0.1:8080/api/video/hot > /dev/null; then
            echo "✅ 后端启动成功！"
            break
          fi
          echo "后端还未就绪，等待 2 秒..."
          sleep 2
        done

    - name: 5. 安装 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 6. 安装 Python 项目依赖
      working-directory: ./auto_test
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 7. 安装 Allure 命令行工具
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jre
        wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        tar -zxvf allure-2.24.0.tgz
        sudo mv allure-2.24.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure

    - name: 8. 执行测试用例
      working-directory: ./auto_test
      run: |
        # 直接跑，不传 --env=github 跳过，因为现在环境是真的通！
        pytest --alluredir=./allure-results

    - name: 9. 生成 Allure HTML 报告
      working-directory: ./auto_test
      run: |
        allure generate ./allure-results -o ./allure-report --clean

    - name: 10. 将报告发布到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./auto_test/allure-report