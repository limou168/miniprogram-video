server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
app:
  jwt:
    secret: video-platform-secret-key-minimum-32-bytes-long!!
    expiration: 604800000  # 7天(毫秒)
  upload:
    path: E:/project/miniprogram-video/upload/
