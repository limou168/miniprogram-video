spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:video_platform}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000   # 10分钟，小于MySQL的wait_timeout，防止连接被服务端关闭
      connection-test-query: SELECT 1  # 分配连接前验证有效性
      validation-timeout: 5000

# JWT 配置（可通过环境变量覆盖）
app:
  jwt:
    secret: ${JWT_SECRET:video-platform-secret-key-minimum-32-bytes-long!!}
    expiration: ${JWT_EXPIRATION:604800000}
  upload:
    path: ${UPLOAD_PATH:/app/upload/}

# 关闭 MyBatis-Plus SQL 日志（生产环境不打印 SQL）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 腾讯云 COS 配置（从环境变量读取）
cos:
  bucket: ${COS_BUCKET:}
  region: ${COS_REGION:}
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  cdn-domain: ${COS_CDN_DOMAIN:}

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
