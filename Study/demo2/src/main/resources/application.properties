spring.application.name=demo2

# ==================== SQL Server 数据源配置 ====================
# 方式一：Windows 集成认证（需要 SQL Server 启用了 Windows 身份验证）
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=demo2;encrypt=false;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 方式二：SQL Server 用户名/密码认证（如 sa 账户）
# 先注释掉上面的 url，取消下面的注释，并填写正确的用户名密码
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=demo2;encrypt=false;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=your_password

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.example.demo2.entity
# 驼峰命名自动映射（数据库字段 user_name → Java 属性 userName）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 开发环境打印 SQL（生产环境请注释掉）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 日志 ====================
logging.level.com.example.demo2=debug
